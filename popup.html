<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
      background: #1a1a1a;
      color: #f0f0f0;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #2a2a2a;
      font-size: 12px;
    }
    .title { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ddd; }
    .tokens { font-weight: 600; color: #4ade80; font-size: 11px; white-space: nowrap; margin-left: 8px; }
    .empty { font-size: 12px; color: #777; padding: 12px 0; text-align: center; }
  </style>
</head>
<body>
  <h3>Chats by token usage</h3>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
